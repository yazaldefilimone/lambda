name: bench

on:
  pull_request:
    paths:
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  compare:
    name: compare
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cache
        uses: Swatinem/rust-cache@v2

      - name: critcmp
        uses: boa-dev/criterion-compare-action@v3
        with:
          branchName: ${{ github.base_ref || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}
