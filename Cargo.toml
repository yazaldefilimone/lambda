[package]
name = "lambdac"
version = "0.1.0"
edition = "2024"
description = "An experimental lambda runtime"
authors = ["Yazalde Filimone <yazaldefilimon@gmail.com>"]
repository = "https://github.com/yazaldefilimone/lambda"
license = "Apache-2.0"

[[bin]]
name = "lambdac"
path = "src/main.rs"
bench = false

[lib]
name = "lambdac"
path = "src/lib.rs"
bench = false

[dependencies]
clap = { version = "4.5.9", features = ["derive"] }
rustc-hash = "2.1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1.42", features = ["glob", "yaml"] }
walkdir = "2.5.0"

[[bench]]
name = "evaluator"
harness = false

[[bench]]
name = "lexer"
harness = false

[[bench]]
name = "parser"
harness = false
